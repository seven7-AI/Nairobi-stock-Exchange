# Reverse proxy for nse-be.
#
# /metrics and /health/ready are operational endpoints and are not exposed
# publicly: Prometheus scrapes them from inside the network.

upstream nse_api {
    server api:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/nse/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nse/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 10m;

    # Operational endpoints stay internal.
    location /metrics      { deny all; }
    location /health/ready { deny all; }

    location /health {
        proxy_pass http://nse_api;
        access_log off;
    }

    location / {
        proxy_pass http://nse_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 120s;
    }
}

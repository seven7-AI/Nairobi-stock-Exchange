# nse-be stack.
#
# celery-beat is present but starts only under the `beat` profile, because the
# daily/weekly/monthly GitHub Actions workflows already generate those reports
# through the CLI. Running both double-generates every report.
#
#   docker compose up -d                      # api + worker + flower + nginx
#   docker compose --profile beat up -d       # ... and the scheduler

name: nse-be

x-app: &app
  build:
    context: ..
    dockerfile: deployment/Dockerfile
  env_file: [.env]
  depends_on:
    postgres: {condition: service_healthy}
    redis: {condition: service_healthy}
  volumes:
    - ../reports:/srv/app/reports
    - ../research/data:/srv/app/research/data:ro
    - app-logs:/srv/app/logs
  restart: unless-stopped

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-nse}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-nse}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    <<: *app
    command: ["uvicorn", "app.web.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  migrate:
    <<: *app
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  celery-worker:
    <<: *app
    command: ["python", "start_celery.py", "worker"]
    healthcheck:
      test: ["CMD", "celery", "-A", "app.celery_app", "inspect", "ping", "-d", "celery@$$HOSTNAME"]
      interval: 60s
      timeout: 10s
      retries: 3

  celery-beat:
    <<: *app
    command: ["python", "start_celery.py", "beat"]
    profiles: ["beat"]

  celery-flower:
    <<: *app
    command: ["celery", "-A", "app.celery_app", "flower", "--port=5555"]
    ports:
      - "127.0.0.1:5555:5555"

  nginx:
    image: nginx:1.27-alpine
    depends_on: [api]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot-www:/var/www/certbot:ro
      - certbot-conf:/etc/letsencrypt:ro
    restart: unless-stopped

  certbot:
    image: certbot/certbot:latest
    volumes:
      - certbot-www:/var/www/certbot
      - certbot-conf:/etc/letsencrypt
    entrypoint: >
      /bin/sh -c "trap exit TERM;
      while :; do certbot renew --webroot -w /var/www/certbot --quiet;
      sleep 12h & wait $${!}; done"
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  certbot-www:
  certbot-conf:
  app-logs:

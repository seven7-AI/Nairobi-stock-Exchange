name: Test

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nse
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d nse"
          --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 5

    env:
      # Composed at run time from these parts rather than written as a DSN
      # literal: a URI with an embedded password is a credential, and secret
      # scanners correctly flag one committed to source.
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_DB: nse
      REDIS_URL: redis://localhost:6379/0
      SUPABASE_URL: https://placeholder.supabase.co
      SUPABASE_KEY: placeholder-key
      JWT_SECRET_KEY: ci-secret-not-for-production-at-least-32-bytes
      BCRYPT_ROUNDS: "4"
      ENVIRONMENT: local

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --dev --frozen

      - name: Compose the test database URL
        run: |
          echo "TEST_DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}" >> "$GITHUB_ENV"

      - name: Ruff
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: mypy
        run: uv run mypy app/

      - name: Apply migrations
        run: uv run alembic upgrade head

      # stockanalysis_stocks is written by an external scraper. If autogenerate
      # ever emits DDL for it, the include_object hook in app/alembic/env.py is
      # broken and this job must fail.
      - name: Assert migrations are in sync and exclude the external table
        run: |
          uv run alembic revision --autogenerate -m ci-drift-probe
          PROBE=$(ls app/alembic/versions/*ci_drift_probe*.py)
          if grep -q "stockanalysis_stocks" "$PROBE"; then
            echo "::error::Migration autogenerate touched the externally-owned stockanalysis_stocks table."
            cat "$PROBE"; exit 1
          fi
          if grep -qE "op\.(create_table|drop_table|add_column|drop_column|alter_column)" "$PROBE"; then
            echo "::error::Models have drifted from the migrations. Generate a migration."
            cat "$PROBE"; exit 1
          fi
          rm -f "$PROBE"

      - name: pytest
        run: uv run pytest
